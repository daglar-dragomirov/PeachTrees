[project]
name = "peachtrees"
version = "0.1.0"
description = "A never-worse layer over the program produced by any prompt optimizer: per-task form selection and a conservative per-item judge."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["dspy>=3.4.1"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["peachtrees"]
