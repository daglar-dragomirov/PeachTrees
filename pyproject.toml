[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "peachtrees"
version = "1.0.1"
description = "Inference-time answer selection for optimized DSPy programs (GEPA, MIPROv2, SIMBA, ...)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daglar Dragomirov" }]
keywords = ["dspy", "llm", "prompt optimization", "gepa", "agents", "react", "selection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["dspy>=3.0", "litellm>=1.60"]

[project.urls]
Homepage = "https://github.com/daglar-dragomirov/PeachTrees"
Repository = "https://github.com/daglar-dragomirov/PeachTrees"
Issues = "https://github.com/daglar-dragomirov/PeachTrees/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/peachtrees"]

[tool.hatch.build.targets.sdist]
include = ["src/peachtrees", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["assets"]
